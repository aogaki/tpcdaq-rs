# daq_example.toml — 本番 DAQ 機の設定雛形(SPEC §3、NEW_DAQ_SETUP §6、tools/deploy/daq_up.sh が読む)。
# 写して /opt/tpcdaq/daq.toml に置き、<...> を埋める。パスフレーズを書くので chmod 600。
# daq_up.sh は [system] の output_root / geometry / ped_table と [root_sink] の build_timeout_ms / raw_tree も読む。

[system]
experiment = "mini_eTPC"
output_root = "/srv/tpcdaq"
geometry = "/opt/tpcdaq/assets/<mini の実ジオメトリ>.dat"   # リポ外(実 .dat はリポに入れない)
# ZS(zeroSuppression.enabled)で取るときの pedestal 表(TODO/151、任意)。`calib pedestal` の JSON
# (同じ peakingTime の pedestal run から作る)。書けば存在検査され、root_sink の --pedestal-table に渡る:
# ZS らしいフレームだけ表の mean を引く(FPN 項なし)。full / partial のフレームは従来どおり。
# 書かないまま ZS で取ると PEventTPC はほぼ生 ADC のまま(終了 JSON の pevent_zs_frames_no_table に出る)。
# ped_table = "/opt/tpcdaq/assets/pedestal_<peakingTime>.json"

[[cobo]]
id = 0
listen = "0.0.0.0:46005"           # zCoBo 直結 NIC の IP に絞ってもよい(NIC 設定前でも上がるよう既定は全 IF)
data_sender_id = "CoBo[0]"

[decoder]
workers = 1

[root_sink]
snapshot_hz = 1.0
event_publish_hz = 20.0
build_timeout_ms = 1000
raw_tree = true                    # run{N}_raw.root(macros 直結、075)

[monitor]
ws_listen = "0.0.0.0:9000"
# slow_sub = "tcp://127.0.0.1:47006"   # slowctl を動かすときに有効化(v1.31)

# slowctl(HV / LV の監視のみ — 作動 API は無い、SPEC §11)。この節があれば daq_up.sh が controller の後に起動する(TODO/121)。
# 機器は /dev/serial/by-id/ の名前で指す(挿し直しや USB の口を変えても不変)。open 時に expect_serial と照合する。
# [slowctl]
# status_pub = "tcp://*:47006"
# poll_hz = 1.0
# log_every_s = 60
#
# [[slowctl.device]]
# type = "hivolta"                     # CAEN DT1415ET(8 ch)、USB VCP 9600 8N1
# name = "hv"
# port = "/dev/serial/by-id/usb-CAEN_SPA_DT1415_HV_Power_Supply-if00"
# expect_serial = "<BDSNUM>"
# poll_s = 5.0                         # HV だけ周期を変えられる(TODO/119)。不良 USB ケーブルは偽トリガを作った(TODO/118)— 繋いだらトリガレートを確かめる
#
# [[slowctl.device]]
# type = "hmp2020"                     # R&S/HAMEG HMP2020(AsAd 電源)。本体の Interface を **USB VCP** にしておく(RS-232 のままだと応答しない — 118)
# name = "lv"
# port = "/dev/serial/by-id/usb-HAMEG_HAMEG_HO720_<serial>-if00-port0"
# expect_serial = "<*IDN? の serial>"

[controller]
rest_listen = "0.0.0.0:8080"
passphrase = "<run 制御のパスフレーズ>"
ecc_proxy = "Ecc:tcp -h 127.0.0.1 -p 46002"
router_ip = "<zCoBo から見たこの機体の IP(直結 NIC)>"   # listen が 0.0.0.0 なので明示する(SPEC §8.2)
# 実験で使う physics 設定の id。**GDED の設定リポジトリにある physics は HIgS 2026 用(120 fC / 232 ns / trigDelay 1748)で mini とは別物**(107)。
# VM の GET が実際に読んでいる xcfg を写して prepare-<id> / configure-<id> にしてから書く。
config_id = { describe = "zCobo", prepare = "<physics 設定 id>", configure = "<physics 設定 id>" }
ui_dir = "/opt/tpcdaq/ui"          # ui/dist/ui/browser のコピー
ecc_config_dir = "<ECC の設定リポジトリ>"   # getEccServer --config-repo-url と同じ(078 の生成 xcfg の出力先)
params_dir = "/srv/tpcdaq/params"
# HV / LV の ch ごとの ON/OFF を web から(SPEC §11 v1.42、TODO/124)。slowctl の [slowctl] cmd_bind と同じ口を書く。
# 省略 = POST /api/slow/power は 503(作動の経路を開かない)。HV ON と LV OFF は run が Idle のときだけ。
# slow_cmd = "tcp://127.0.0.1:47007"
