# vcobo.example.conf — vcobo_daq の設定(TOML の部分集合: `key = value` と 1 行の文字列配列)。
#
#   ./vcobo_daq --config vcobo.example.conf
#
# **ch 数・AsAd 数をコードに焼き込まない**という不変条件はここでも守る。
# mini(1 CoBo x 1 AsAd)/ ELITPC(1 論理 CoBo x 4 AsAd)の切り替えは asad_count だけ。
# 未知のキーや型違いは**起動時にエラー**にする(黙って既定値に落ちない)。

# ECC が setName で名乗らせる名前 = "CoBo[<cobo_id>]"。DataLinkSet の DataSender id と
# 一致していないと configure が throw するので、食い違いは WARN で見せる。
cobo_id = 0

# mini = 1、ELITPC = 4。setCircularBuffersEnabled のマスク検査に使う。
asad_count = 1

# Ice の listen。実 ECC は DaqCtrlNode を「同じ IP の port 46004」に決め打ちで探すので
# (HardwareNode.cpp:133,139)、実ウォークではこの 2 つを既定のままにする。
listen_host = "0.0.0.0"
ctrl_port = 46001   # HwNode / AlarmService / Device 群
daq_port  = 46004   # DaqCtrlNode

# ペーシング。0 = 全速(031 の負荷ハーネスモード)。
rate_hz = 100.0

# 送り切ったあと先頭に戻すか。false なら送出静止(**リンクは保持**)。
loop = false

# 自前のチャンク化しきい値と、端数を吐き出すハートビート周期(実機は 3 s)。
flush_bytes = 8192
heartbeat_flush_ms = 3000

# データソース。**バイト無変換**でこの順に流す。実 .graw はローカルのみ(リポに入れない)。
graw_files = ["/path/to/CoBo0_AsAd0_2025-01-01T00-00-00.000_0000.graw"]
