[package]
name = "tpcdaq"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.45"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
thiserror = "2.0.20"
tmq = "0.4"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "net",
    "io-util",
    "signal",
] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zmq = "0.10"

# CLAUDE.md Coding Standards: `.unwrap()` 禁止(production)。
# テストコード側は各テストモジュールで `#[allow(clippy::unwrap_used)]` する。
[lints.clippy]
unwrap_used = "deny"
